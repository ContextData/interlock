name: Release and cloud foundations

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/cloud-certification.yml"
      - ".github/workflows/release-foundations.yml"
      - "deploy/helm/**"
      - "deploy/scripts/release/**"
      - "deploy/terraform/**"
      - "tests/unit/test_release_cloud_automation.py"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/cloud-certification.yml"
      - ".github/workflows/release-foundations.yml"
      - "deploy/helm/**"
      - "deploy/scripts/release/**"
      - "deploy/terraform/**"
      - "tests/unit/test_release_cloud_automation.py"

permissions:
  contents: read

jobs:
  contracts:
    name: Release contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7

      - name: Install locked test dependencies
        run: uv sync --locked --extra dev

      - name: Validate release contracts
        run: uv run pytest tests/unit/test_release_cloud_automation.py tests/unit/test_helm_validation.py -q

  workflows:
    name: GitHub Actions syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run actionlint from immutable source release
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" "${archive}" | sha256sum --check --status
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" \
            .github/workflows/release.yml \
            .github/workflows/cloud-certification.yml \
            .github/workflows/release-foundations.yml

  terraform:
    name: Terraform format and provider validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.5
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive deploy/terraform

      - name: Validate AWS root
        working-directory: deploy/terraform/environments/aws
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate DigitalOcean root
        working-directory: deploy/terraform/environments/digitalocean
        run: |
          terraform init -backend=false
          terraform validate

  helm:
    name: Helm lint and immutable render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0

      - name: Lint and render release chart
        run: |
          helm lint deploy/helm/interlock
          helm template interlock deploy/helm/interlock \
            --set-string image.repository=ghcr.io/example/interlock-runtime \
            --set-string image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            > "${RUNNER_TEMP}/interlock-rendered.yaml"
          grep -q 'ghcr.io/example/interlock-runtime@sha256:' "${RUNNER_TEMP}/interlock-rendered.yaml"
