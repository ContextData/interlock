[mypy]
python_version = 3.12
plugins = pydantic.mypy
strict = True
follow_imports = silent
exclude = tests/
show_error_codes = True
show_column_numbers = False
pretty = False
color_output = False
error_summary = False
cache_dir = .mypy_cache/v1

# These libraries are used behind typed InterLock boundaries but do not publish
# complete PEP 561 metadata. Keep exceptions module-specific so missing types in
# first-party modules and newly added dependencies still fail the V1 gate.
[mypy-aiobotocore.*]
ignore_missing_imports = True

[mypy-aiomysql.*]
ignore_missing_imports = True

[mypy-asyncpg.*]
ignore_missing_imports = True

[mypy-googleapiclient.*]
ignore_missing_imports = True

[mypy-openpyxl.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True
