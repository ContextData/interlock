    path: /dashboard/data-sources/sample_shop
  - name: connectors
    path: /dashboard/connectors
  - name: identities
    path: /dashboard/access-control/identities
  - name: policies
    path: /dashboard/policies
  - name: audit
    path: /dashboard/audit-costs
  - name: write-safety
    path: /dashboard/write-safety
