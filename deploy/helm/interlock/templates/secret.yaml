{{- if and (not .Values.database.existingSecret) (not .Values.database.password) }}
{{- fail "database.existingSecret or database.password is required" }}
{{- end }}
{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "interlock.fullname" . }}-db-credentials
  labels:
    {{- include "interlock.labels" . | nindent 4 }}
  annotations:
    # Created ahead of the migration Job, which is a pre-install hook and
    # reads these credentials. See configmap.yaml for the full explanation.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
data:
  username: {{ required "database.user is required when database.existingSecret is empty" .Values.database.user | b64enc | quote }}
  password: {{ required "database.password is required when database.existingSecret is empty" .Values.database.password | b64enc | quote }}
{{- end }}
{{- if and (not .Values.database.existingSecret) (not .Values.admin.secret.existingSecret) }}
---
{{- end }}
{{- if and (not .Values.admin.secret.existingSecret) (not .Values.admin.secret.value) }}
{{- fail "admin.secret.existingSecret or admin.secret.value is required" }}
{{- end }}
{{- if not .Values.admin.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "interlock.fullname" . }}-admin-secret
  labels:
    {{- include "interlock.labels" . | nindent 4 }}
  annotations:
    # Created ahead of the migration Job, which is a pre-install hook and
    # reads these credentials. See configmap.yaml for the full explanation.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
data:
  {{ .Values.admin.secret.secretKey }}: {{ required "admin.secret.value is required when admin.secret.existingSecret is empty" .Values.admin.secret.value | b64enc | quote }}
{{- end }}
{{- if and .Values.auth.oidc.enabled (not .Values.auth.oidc.adminClientSecretExistingSecret) }}
{{- fail "auth.oidc.adminClientSecretExistingSecret is required when OIDC is enabled" }}
{{- end }}
