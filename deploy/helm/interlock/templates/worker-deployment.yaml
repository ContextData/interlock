apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "interlock.fullname" . }}-worker
  labels:
    {{- include "interlock.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "interlock.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      annotations:
        {{- include "interlock.podAnnotations" . | nindent 8 }}
      labels:
        {{- include "interlock.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- include "interlock.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          image: {{ include "interlock.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "interlock.worker"]
          envFrom:
            - configMapRef:
                name: {{ include "interlock.fullname" . }}-config
            {{- with .Values.worker.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: INTERLOCK_SERVICE_ROLE
              value: worker
            - name: INTERLOCK_DATABASE__USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | default (printf "%s-db-credentials" (include "interlock.fullname" .)) }}
                  key: {{ .Values.database.secretUserKey }}
            - name: INTERLOCK_DATABASE__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | default (printf "%s-db-credentials" (include "interlock.fullname" .)) }}
                  key: {{ .Values.database.secretPasswordKey }}
            {{- include "interlock.redisEnv" . | nindent 12 }}
            {{- with .Values.worker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/interlock
            - name: control-db-ca
              mountPath: /run/secrets/control-db-ca
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
        - name: control-db-ca
          secret:
            secretName: {{ required "database.caExistingSecret is required" .Values.database.caExistingSecret }}
            items:
              - key: {{ .Values.database.caSecretKey }}
                path: ca.crt
