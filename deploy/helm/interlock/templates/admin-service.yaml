apiVersion: v1
kind: Service
metadata:
  name: {{ include "interlock.fullname" . }}-admin
  labels:
    {{- include "interlock.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  type: {{ .Values.admin.service.type }}
  ports:
    - port: {{ .Values.admin.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "interlock.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: admin
