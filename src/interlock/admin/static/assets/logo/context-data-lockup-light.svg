    <path d="M54 16 H64 V56 H54" stroke="#414B58" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"></path>
    <circle cx="40" cy="36" r="8.5" fill="#8FC01E"></circle>
  </g>
  <text x="52" y="34" class="wm" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="600" letter-spacing="-0.3" fill="#0B0D11">context<tspan fill="#8FC01E">.</tspan>data</text>
</svg>
