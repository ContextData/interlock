{# Change the signed-in admin's own password. The CSRF header is attached by dashboard.js. #}
<div class="form-card" id="change-password-form">
  {% if error %}
  <div class="form-error" role="alert">{{ error }}</div>
  {% endif %}
  <form hx-post="/auth/change-password"
        hx-target="#change-password-form"
        hx-swap="outerHTML">
    <div class="form-row">
      <label>Current password
        <input name="current_password" type="password" autocomplete="current-password" required>
      </label>
    </div>
    <div class="form-row">
      <label>New password
        <input name="new_password" type="password" autocomplete="new-password"
               minlength="12" required aria-describedby="new-password-help">
      </label>
      <label>Confirm new password
        <input name="confirm_password" type="password" autocomplete="new-password"
               minlength="12" required>
      </label>
    </div>
    <p class="field-help" id="new-password-help">
      At least 12 characters. It cannot be <code>admin</code>, your username or your
      current password. Changing it signs you out everywhere else.
    </p>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Change password</button>
    </div>
  </form>
</div>
