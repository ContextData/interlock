# DigitalOcean App Platform spec for the documentation site at
# https://interlock.contextdata.io. Create or update it with:
#
#   doctl apps create --spec .do/docs-app.yaml
#   doctl apps update <app-id> --spec .do/docs-app.yaml
#
# App Platform builds docs-site/ from main on every push and serves the static
# output. The site is plain static files: no server, no secrets, no runtime.
name: interlock-docs
region: nyc
# contextdata.io is served by Cloudflare, not DigitalOcean DNS, so there is no
# `zone`: the record is a CNAME in Cloudflare to this app's default ingress,
# unproxied (DNS only) so App Platform can issue and renew the certificate.
domains:
  - domain: interlock.contextdata.io
    type: PRIMARY
static_sites:
  - name: docs
    github:
      repo: ContextData/interlock
      branch: main
      deploy_on_push: true
    source_dir: docs-site
    environment_slug: node-js
    build_command: npm ci --no-audit --no-fund && npm run build
    output_dir: dist
    error_document: 404.html
    envs:
      - key: DOCS_SITE_URL
        value: https://interlock.contextdata.io
        scope: BUILD_TIME
